<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MU! - Search</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="admin-link" id="adminLink" href="./admin/login.html">تسجيل آدمن</a>
    <img class="logo" src="./assets/Project 272 [6FBA28E].png" alt="logo" />
    <div class="lang-slot" id="langSlot"></div>
  </header>

  <main class="page">
    <div class="page-title">
      <button class="icon-btn" id="backBtn">رجوع</button>
      <div class="title-line" id="pageTitle">بحث</div>
      <div style="width:76px"></div>
    </div>

    <div class="search-box">
      <input class="input" id="q" placeholder="ابحث بالاسم أو ID" />
      <select class="input" id="type">
        <option value="">عام</option>
        <option value="cafe">مشروب</option>
        <option value="food">أكلة</option>
      </select>
      <button class="btn" id="btn">بحث</button>
    </div>

    <div class="items" id="items"></div>
  </main>

  <script type="module">
    import { searchItems } from './assets/firebase.js';
    import { applyLangToDocument, mountLangSwitcher, t } from './assets/i18n.js';

    applyLangToDocument();
    mountLangSwitcher(document.getElementById('langSlot'));
    document.getElementById('adminLink').textContent = t('admin_login');
    document.getElementById('backBtn').textContent = t('back');
    document.getElementById('pageTitle').textContent = t('search_title');
    document.getElementById('q').placeholder = t('search') + '...';
    document.getElementById('btn').textContent = t('search');
    document.querySelector('#type option[value=""]').textContent = t('type_all');
    document.querySelector('#type option[value="cafe"]').textContent = t('type_cafe');
    document.querySelector('#type option[value="food"]').textContent = t('type_food');

    document.getElementById('backBtn').addEventListener('click', () => {
      location.href = './index.html';
    });
    const params = new URLSearchParams(location.search);
    const initialType = params.get('type') || '';
    document.getElementById('type').value = initialType;

    function renderItem(item) {
      const img = item.imageUrl ? `<img class="item-img" src="${item.imageUrl}" alt="" loading="lazy" />` : `<div class="item-img item-img-empty"></div>`;
      return `
        <a class="item-card" href="./item.html?id=${encodeURIComponent(item.id)}">
          ${img}
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="meta">${item.type.toUpperCase()} / ${item.sectionName || ''} / ID: ${item.id}</div>
          </div>
        </a>
      `;
    }

    async function doSearch() {
      const q = document.getElementById('q').value.trim();
      const type = document.getElementById('type').value;
      const items = await searchItems(q, type);
      document.getElementById('items').innerHTML = items.map(renderItem).join('') || `<div class="empty">${t('empty_results')}</div>`;
    }

    document.getElementById('btn').addEventListener('click', () => {
      doSearch().catch(e => alert(e.message));
    });

    document.getElementById('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn').click();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MU! - Item</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="./assets/Project 272 [6FBA28E].png" alt="logo" />
    <div class="lang-slot" id="langSlot"></div>
  </header>

  <main class="page">
    <div class="page-title">
      <button class="icon-btn" id="backBtn">رجوع</button>
      <div class="title-line" id="title"></div>
      <div style="width:76px"></div>
    </div>

    <div class="item-page" id="content"></div>
  </main>

  <script type="module">
    import { getItemById } from './assets/firebase.js';
    import { moneyIQD, calcDiscountedPrice } from './assets/api.js';
    import { applyLangToDocument, mountLangSwitcher, t } from './assets/i18n.js';
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    applyLangToDocument();
    mountLangSwitcher(document.getElementById('langSlot'));
    const lang = document.documentElement.lang === 'en' ? 'en' : 'ar';
    document.getElementById('backBtn').textContent = t('back');
    document.getElementById('backBtn').addEventListener('click', () => {
      location.href = './index.html';
    });

    async function load() {
      if (!id) throw new Error('Missing id');
      const item = await getItemById(id);
      if (!item) throw new Error('Item not found');

      const price = Number(item.price);
      const discount = Number(item.discountPercent || 0);
      const now = Date.now();
      const discountUntil = item.discountUntil ? Number(item.discountUntil) : null;
      const discountActive = discount > 0 && (!discountUntil || now < discountUntil);
      const discounted = discountActive ? calcDiscountedPrice(price, discount) : null;

      const img = item.imageUrl ? `<img class="item-page-img" src="${item.imageUrl}" alt="" />` : `<div class="item-page-img item-img-empty"></div>`;
      const priceHtml = discountActive ? `
        <div class="price-row big">
          <span class="old-price">${moneyIQD(price)}</span>
          <span class="new-price">${moneyIQD(discounted)}</span>
          <span class="badge">خصم ${discount}%</span>
        </div>
      ` : `
        <div class="price-row big"><span class="new-price">${moneyIQD(price)}</span></div>
      `;

      const name = lang === 'en' ? (item.nameEn || item.nameAr || item.name || '') : (item.nameAr || item.name || item.nameEn || '');
      const desc = lang === 'en' ? (item.descriptionEn || item.descriptionAr || item.description || '') : (item.descriptionAr || item.description || item.descriptionEn || '');

      document.getElementById('title').textContent = name;
      document.getElementById('content').innerHTML = `
        <div class="item-page-card">
          ${img}
          <div class="item-page-info">
            <div class="item-name big">${name}</div>
            ${priceHtml}
            <div class="item-desc big">${desc || ''}</div>
          </div>
        </div>
      `;
    }

    load().catch(err => {
      document.getElementById('content').innerHTML = `<div class="empty">خطأ: ${err.message}</div>`;
    });
  </script>
</body>
</html>

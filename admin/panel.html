<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MU! - Admin Panel</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="admin-link" id="homeLink" href="../index.html">الرئيسية</a>
    <img class="logo" src="../assets/Project 272 [6FBA28E].png" alt="logo" />
    <div class="lang-slot" id="langSlot"></div>
  </header>

  <main class="page">
    <div class="page-title">
      <button class="icon-btn" id="backBtn">رجوع</button>
      <div class="title-line" id="pageTitle">ADMIN PANEL</div>
      <button class="icon-btn" id="logout">خروج</button>
    </div>

    <div class="admin-tools">
      <button class="btn" id="addBtn">+ إضافة طبق/مشروب</button>
      <button class="btn" id="sectionsBtn">+ إضافة/تعديل الأقسام</button>
      <div class="search-box" style="grid-template-columns:1fr 180px 120px; margin-top:12px">
        <input class="input" id="q" placeholder="بحث بالاسم أو ID" />
        <select class="input" id="type">
          <option value="">عام</option>
          <option value="cafe">مشروب</option>
          <option value="food">أكلة</option>
        </select>
        <button class="btn" id="searchBtn">بحث</button>
      </div>
    </div>

    <div class="items" id="items"></div>

    <div class="modal" id="modal" hidden>
      <div class="modal-card">
        <div class="modal-title" id="modalTitle">إضافة</div>

        <div class="form">
          <input type="hidden" id="id" />

          <label class="label">النوع</label>
          <select class="input" id="formType">
            <option value="cafe">مشروب (Cafe)</option>
            <option value="food">أكلة (Food)</option>
          </select>

          <label class="label">القسم</label>
          <select class="input" id="sectionId"></select>

          <label class="label">الاسم</label>
          <input class="input" id="name" />

          <label class="label">السعر (IQD)</label>
          <input class="input" id="price" inputmode="numeric" />

          <label class="label">الوصف</label>
          <textarea class="input" id="description" rows="3"></textarea>

          <label class="label">رابط الصورة (اختياري)</label>
          <input class="input" id="imageUrl" placeholder="https://..." />

          <div class="row">
            <button class="btn" id="save">حفظ</button>
            <button class="icon-btn" id="cancel" type="button">إلغاء</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="actions" hidden>
      <div class="modal-card">
        <div class="modal-title">خيارات</div>
        <div class="form">
          <div class="row" style="grid-template-columns:1fr; gap:10px">
            <button class="btn" id="edit">تعديل</button>
            <button class="btn" id="discount">خصم (مدة الخصم)</button>
            <button class="btn" id="clearDiscount">مسح الخصم</button>
            <button class="btn danger" id="del">حذف</button>
            <button class="icon-btn" id="closeActions">إغلاق</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="discountModal" hidden>
      <div class="modal-card">
        <div class="modal-title">خصم</div>
        <div class="form">
          <label class="label">نسبة الخصم (1% إلى 100%)</label>
          <input class="input" id="discountPercent" inputmode="numeric" />

          <label class="label">المدة</label>
          <div class="row" style="grid-template-columns:1fr 1fr; gap:10px">
            <input class="input" id="durationAmount" inputmode="numeric" placeholder="العدد" />
            <select class="input" id="durationUnit">
              <option value="hours">ساعات</option>
              <option value="days">أيام</option>
              <option value="years">سنين</option>
              <option value="forever">دائم</option>
            </select>
          </div>

          <div class="row">
            <button class="btn" id="applyDiscount">تطبيق</button>
            <button class="icon-btn" id="cancelDiscount">إلغاء</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script type="module">
    import {
      adminListAll,
      adminUpsertItem,
      adminDeleteItem,
      adminSetDiscount,
      adminClearDiscount,
      adminUpsertSection,
      adminDeleteSection,
    } from '../assets/firebase.js';
    import { moneyIQD, calcDiscountedPrice } from '../assets/api.js';
    import { applyLangToDocument, mountLangSwitcher, t } from '../assets/i18n.js';
    const TOKEN_KEY = 'mu_admin_token';
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (!token) location.href = './login.html';

    const state = {
      sections: null,
      items: [],
      selected: null,
    };

    applyLangToDocument();
    mountLangSwitcher(document.getElementById('langSlot'));
    document.getElementById('homeLink').textContent = t('home');
    document.getElementById('backBtn').textContent = t('back');
    document.getElementById('pageTitle').textContent = t('admin_panel');
    document.getElementById('logout').textContent = t('logout');
    document.getElementById('addBtn').textContent = t('add_item');
    document.getElementById('sectionsBtn').textContent = t('manage_sections');
    document.getElementById('searchBtn').textContent = t('search');
    document.querySelector('#type option[value=""]').textContent = t('type_all');
    document.querySelector('#type option[value="cafe"]').textContent = t('type_cafe');
    document.querySelector('#type option[value="food"]').textContent = t('type_food');

    document.getElementById('backBtn').addEventListener('click', () => {
      location.href = '../index.html';
    });

    function show(el, yes) {
      el.style.display = yes ? 'flex' : 'none';
    }

    function closeAllModals() {
      show(document.getElementById('modal'), false);
      show(document.getElementById('actions'), false);
      show(document.getElementById('discountModal'), false);
      show(document.getElementById('sectionsModal'), false);
    }

    function setSecHint(msg) {
      document.getElementById('secHint').textContent = msg || '';
    }

    function fillSectionsAdminSelect() {
      const type = document.getElementById('secType').value;
      const sel = document.getElementById('secId');
      sel.innerHTML = '';
      const obj = (state.sections && state.sections[type]) ? state.sections[type] : {};
      const list = Object.values(obj);
      for (const s of list) {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.name} (${s.id})`;
        sel.appendChild(opt);
      }
      if (!sel.value && list[0]) sel.value = list[0].id;
    }

    function loadSectionFormFromSelected() {
      const type = document.getElementById('secType').value;
      const id = document.getElementById('secId').value;
      const s = state.sections && state.sections[type] ? state.sections[type][id] : null;
      document.getElementById('secName').value = s ? (s.name || '') : '';
      document.getElementById('secDesc').value = s ? (s.description || '') : '';
    }

    function openSectionsModal() {
      closeAllModals();
      setSecHint('');
      fillSectionsAdminSelect();
      loadSectionFormFromSelected();
      show(document.getElementById('sectionsModal'), true);
    }

    function openForm(item) {
      closeAllModals();
      show(document.getElementById('modal'), true);
      document.getElementById('modalTitle').textContent = item ? 'تعديل' : 'إضافة';

      document.getElementById('id').value = item ? item.id : '';
      document.getElementById('formType').value = item ? item.type : 'cafe';

      fillSectionsSelect();
      document.getElementById('sectionId').value = item ? item.sectionId : (document.getElementById('sectionId').value || '');

      document.getElementById('name').value = item ? item.name : '';
      document.getElementById('price').value = item ? item.price : '';
      document.getElementById('description').value = item ? (item.description || '') : '';
      document.getElementById('imageUrl').value = item ? (item.imageUrl || '') : '';
    }

    function openActions(item) {
      state.selected = item;
      closeAllModals();
      show(document.getElementById('actions'), true);
    }

    function openDiscount(item) {
      state.selected = item;
      closeAllModals();
      show(document.getElementById('discountModal'), true);
      document.getElementById('discountPercent').value = item.discountPercent || '';
      document.getElementById('durationAmount').value = '';
      document.getElementById('durationUnit').value = 'days';
    }

    function fillSectionsSelect() {
      const type = document.getElementById('formType').value;
      const select = document.getElementById('sectionId');
      select.innerHTML = '';
      const sectionsObj = (state.sections && state.sections[type]) ? state.sections[type] : {};
      const list = Object.values(sectionsObj);
      for (const s of list) {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        select.appendChild(opt);
      }
    }

    function renderItemCard(item) {
      const img = item.imageUrl ? `<img class="item-img" src="${item.imageUrl}" alt="" loading="lazy" />` : `<div class="item-img item-img-empty"></div>`;
      const price = Number(item.price);
      const discount = Number(item.discountPercent || 0);
      const now = Date.now();
      const until = item.discountUntil ? Number(item.discountUntil) : 0;
      const active = discount > 0 && (!until || now < until);
      const discounted = active ? calcDiscountedPrice(price, discount) : null;

      const priceHtml = active ? `
        <div class="price-row">
          <span class="old-price">${moneyIQD(price)}</span>
          <span class="new-price">${moneyIQD(discounted)}</span>
          <span class="badge">خصم ${discount}%</span>
        </div>
      ` : `
        <div class="price-row"><span class="new-price">${moneyIQD(price)}</span></div>
      `;

      return `
        <div class="item-card admin-item" data-id="${item.id}">
          ${img}
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            ${priceHtml}
            <div class="meta">${item.type.toUpperCase()} / ${item.sectionName || ''} / ID: ${item.id}</div>
          </div>
        </div>
      `;
    }

    function render(items) {
      document.getElementById('items').innerHTML = items.map(renderItemCard).join('') || '<div class="empty">لا توجد عناصر</div>';
      document.querySelectorAll('.admin-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          const item = state.items.find(x => x.id === id);
          if (item) openActions(item);
        });
      });
    }

    async function loadAll() {
      const res = await adminListAll(token);
      state.sections = res.sections;
      state.items = res.items || [];
      render(state.items);
    }

    async function saveSection() {
      setSecHint('');
      const type = document.getElementById('secType').value;
      const currentId = document.getElementById('secId').value;
      const isNew = (document.getElementById('secId').dataset.new === '1');
      const id = isNew ? '' : currentId;
      const name = document.getElementById('secName').value;
      const description = document.getElementById('secDesc').value;
      const res = await adminUpsertSection(token, type, { id, name, description });

      await loadAll();
      document.getElementById('secType').value = type;
      fillSectionsAdminSelect();
      document.getElementById('secId').dataset.new = '0';
      document.getElementById('secId').value = res.id;
      loadSectionFormFromSelected();
      setSecHint('تم الحفظ');
    }

    async function deleteSection() {
      setSecHint('');
      const type = document.getElementById('secType').value;
      const id = document.getElementById('secId').value;
      if (!id) return;
      if (!confirm('تأكيد حذف القسم؟ (لازم يكون فارغ)')) return;
      await adminDeleteSection(token, type, id);
      await loadAll();
      fillSectionsAdminSelect();
      loadSectionFormFromSelected();
      setSecHint('تم الحذف');
    }

    async function saveItem() {
      const body = {
        id: document.getElementById('id').value.trim() || undefined,
        type: document.getElementById('formType').value,
        sectionId: document.getElementById('sectionId').value,
        name: document.getElementById('name').value,
        price: document.getElementById('price').value,
        description: document.getElementById('description').value,
        imageUrl: document.getElementById('imageUrl').value,
      };
      await adminUpsertItem(token, body);
      closeAllModals();
      await loadAll();
    }

    async function deleteItem() {
      if (!state.selected) return;
      if (!confirm('تأكيد الحذف؟')) return;
      await adminDeleteItem(token, state.selected.id);
      closeAllModals();
      await loadAll();
    }

    async function clearDiscount() {
      if (!state.selected) return;
      await adminClearDiscount(token, state.selected.id);
      closeAllModals();
      await loadAll();
    }

    async function applyDiscount() {
      if (!state.selected) return;
      const percent = Number(document.getElementById('discountPercent').value);
      const unit = document.getElementById('durationUnit').value;
      const amountRaw = document.getElementById('durationAmount').value;

      const duration = unit === 'forever' ? { unit: 'forever', amount: 1 } : { unit, amount: Number(amountRaw || 0) };
      await adminSetDiscount(token, state.selected.id, percent, duration);
      closeAllModals();
      await loadAll();
    }

    function doSearch() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const type = document.getElementById('type').value;
      let items = state.items;
      if (type) items = items.filter(x => x.type === type);
      if (q) {
        items = items.filter(x => x.id.toLowerCase() === q || String(x.name || '').toLowerCase().includes(q));
      }
      render(items);
    }

    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      location.href = './login.html';
    });

    document.getElementById('addBtn').addEventListener('click', () => openForm(null));
    document.getElementById('sectionsBtn').addEventListener('click', () => openSectionsModal());
    document.getElementById('save').addEventListener('click', () => saveItem().catch(e => alert(e.message)));
    document.getElementById('cancel').addEventListener('click', () => closeAllModals());

    document.getElementById('searchBtn').addEventListener('click', () => doSearch());

    document.getElementById('closeActions').addEventListener('click', () => closeAllModals());
    document.getElementById('edit').addEventListener('click', () => openForm(state.selected));
    document.getElementById('discount').addEventListener('click', () => openDiscount(state.selected));
    document.getElementById('clearDiscount').addEventListener('click', () => clearDiscount().catch(e => alert(e.message)));
    document.getElementById('del').addEventListener('click', () => deleteItem().catch(e => alert(e.message)));

    document.getElementById('formType').addEventListener('change', () => fillSectionsSelect());

    document.getElementById('cancelDiscount').addEventListener('click', () => closeAllModals());
    document.getElementById('applyDiscount').addEventListener('click', () => applyDiscount().catch(e => alert(e.message)));

    document.getElementById('secClose').addEventListener('click', () => closeAllModals());
    document.getElementById('secType').addEventListener('change', () => {
      document.getElementById('secId').dataset.new = '0';
      fillSectionsAdminSelect();
      loadSectionFormFromSelected();
    });
    document.getElementById('secId').addEventListener('change', () => {
      document.getElementById('secId').dataset.new = '0';
      loadSectionFormFromSelected();
    });
    document.getElementById('secNew').addEventListener('click', () => {
      document.getElementById('secId').dataset.new = '1';
      document.getElementById('secName').value = '';
      document.getElementById('secDesc').value = '';
      setSecHint('');
    });
    document.getElementById('secSave').addEventListener('click', () => saveSection().catch(e => setSecHint('خطأ: ' + e.message)));
    document.getElementById('secDelete').addEventListener('click', () => deleteSection().catch(e => setSecHint('خطأ: ' + e.message)));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllModals();
    });

    loadAll().catch(e => {
      alert(e.message);
      localStorage.removeItem(TOKEN_KEY);
      location.href = './login.html';
    });
  </script>
</body>
</html>

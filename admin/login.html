<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MU! - Admin Login</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="admin-link" id="homeLink" href="../index.html">الرئيسية</a>
    <img class="logo" src="../assets/Project 272 [6FBA28E].png" alt="logo" />
    <div class="lang-slot" id="langSlot"></div>
  </header>

  <main class="page">
    <div class="page-title">
      <button class="icon-btn" id="backBtn">رجوع</button>
      <div class="title-line" id="pageTitle">ADMIN</div>
      <div style="width:76px"></div>
    </div>

    <div class="panel" id="panel">
      <div class="panel-title" id="panelTitle">تسجيل الآدمن</div>
      <div class="form">
        <label class="label" id="usernameLabel">يوزر</label>
        <input class="input" id="username" value="admin" />

        <label class="label" id="passwordLabel">باسوورد</label>
        <input class="input" id="password" type="password" placeholder="اكتب كلمة السر" />

        <button class="btn" id="loginBtn">دخول</button>
        <div class="hint" id="hint"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { adminLogin, initSections } from '../assets/firebase.js';
    import { applyLangToDocument, mountLangSwitcher, t } from '../assets/i18n.js';
    const TOKEN_KEY = 'mu_admin_token';

    applyLangToDocument();
    mountLangSwitcher(document.getElementById('langSlot'));
    document.getElementById('homeLink').textContent = t('home');
    document.getElementById('backBtn').textContent = t('back');
    document.getElementById('pageTitle').textContent = t('admin');
    document.getElementById('panelTitle').textContent = t('admin_login');
    document.getElementById('usernameLabel').textContent = t('username');
    document.getElementById('passwordLabel').textContent = t('password');
    document.getElementById('loginBtn').textContent = t('login');

    document.getElementById('backBtn').addEventListener('click', () => {
      location.href = '../index.html';
    });

    function setHint(msg) {
      document.getElementById('hint').textContent = msg || '';
    }

    async function tryLogin() {
      setHint('');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await adminLogin(username, password);
        localStorage.setItem(TOKEN_KEY, res.token);
        location.href = './panel.html';
      } catch (e) {
        setHint('خطأ: ' + e.message);
      }
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      tryLogin();
    });

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    // Initialize sections on page load
    initSections().catch(console.error);
    
    const existing = localStorage.getItem(TOKEN_KEY);
    if (existing) {
      location.href = './panel.html';
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MU! - Menu</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="./assets/Project 272 [6FBA28E].png" alt="logo" />
    <div class="lang-slot" id="langSlot"></div>
  </header>

  <main class="page">
    <div class="page-title">
      <button class="icon-btn" id="backBtn">رجوع</button>
      <div>
        <div class="title-line" id="menuTitle"></div>
        <div class="subtitle" id="menuSubtitle"></div>
      </div>
      <div style="width:76px"></div>
    </div>

    <div class="chips" id="sectionChips"></div>

    <div class="section-hero">
      <div class="section-hero-title" id="sectionName"></div>
      <div class="section-hero-desc" id="sectionDesc"></div>
    </div>

    <div class="items" id="items"></div>
  </main>

  <script type="module">
    import { listSections, listItemsBySection, computeDiscount, initSections } from './assets/firebase.js';
    import { moneyIQD, calcDiscountedPrice } from './assets/api.js';
    import { applyLangToDocument, mountLangSwitcher, t } from './assets/i18n.js';
    const params = new URLSearchParams(location.search);
    const type = (params.get('type') || 'cafe').toLowerCase();
    const sectionIdFromUrl = params.get('section');

    applyLangToDocument();
    mountLangSwitcher(document.getElementById('langSlot'));
    document.getElementById('backBtn').textContent = t('back');

    document.getElementById('backBtn').addEventListener('click', () => {
      location.href = './index.html';
    });

    const TITLE = type === 'food' ? t('food_menu_title') : t('cafe_menu_title');
    document.getElementById('menuTitle').textContent = TITLE;
    document.getElementById('menuSubtitle').textContent = type === 'food' ? t('food_menu') : t('cafe_menu');

    const lang = document.documentElement.lang === 'en' ? 'en' : 'ar';
    const pickName = (x) => lang === 'en' ? (x.nameEn || x.nameAr || x.name || '') : (x.nameAr || x.name || x.nameEn || '');
    const pickDesc = (x) => lang === 'en' ? (x.descriptionEn || x.descriptionAr || x.description || '') : (x.descriptionAr || x.description || x.descriptionEn || '');

    function activeSectionStyle(el, active) {
      el.classList.toggle('chip-active', active);
    }

    function renderItemCard(item) {
      const name = pickName(item);
      const desc = pickDesc(item);
      const price = Number(item.price);
      const discount = Number(item.discountPercent || 0);
      const now = Date.now();
      const discountUntil = item.discountUntil ? Number(item.discountUntil) : null;
      const discountActive = discount > 0 && (!discountUntil || now < discountUntil);
      const discounted = discountActive ? calcDiscountedPrice(price, discount) : null;

      const img = item.imageUrl ? `<img class="item-img" src="${item.imageUrl}" alt="" loading="lazy" />` : `<div class="item-img item-img-empty"></div>`;

      const priceHtml = discountActive ? `
        <div class="price-row">
          <span class="old-price">${moneyIQD(price)}</span>
          <span class="new-price">${moneyIQD(discounted)}</span>
          <span class="badge">خصم ${discount}%</span>
        </div>
      ` : `
        <div class="price-row">
          <span class="new-price">${moneyIQD(price)}</span>
        </div>
      `;

      return `
        <a class="item-card" href="./item.html?id=${encodeURIComponent(item.id)}">
          ${img}
          <div class="item-info">
            <div class="item-name">${name}</div>
            ${priceHtml}
            <div class="item-desc">${desc || ''}</div>
          </div>
        </a>
      `;
    }

    async function load() {
      // Ensure sections exist in Firebase
      try {
        await initSections();
      } catch (e) {
      }
      
      let sections;
      try {
        sections = await listSections(type);
      } catch (e) {
        throw e;
      }
      
      const sectionId = sectionIdFromUrl || (sections[0] && sections[0].id);

      const chips = document.getElementById('sectionChips');
      chips.innerHTML = '';
      for (const s of sections) {
        const a = document.createElement('a');
        a.href = `./menu.html?type=${encodeURIComponent(type)}&section=${encodeURIComponent(s.id)}`;
        a.className = 'chip';
        a.textContent = pickName(s);
        activeSectionStyle(a, s.id === sectionId);
        chips.appendChild(a);
      }

      const current = sections.find(x => x.id === sectionId) || sections[0];
      document.getElementById('sectionName').textContent = current ? pickName(current) : '';
      document.getElementById('sectionDesc').textContent = current ? pickDesc(current) : '';

      const items = await listItemsBySection(type, sectionId);
      const container = document.getElementById('items');
      container.innerHTML = items.map(renderItemCard).join('') || `<div class="empty">${t('empty_items')}</div>`;
    }

    load().catch(err => {
      document.getElementById('items').innerHTML = `<div class="empty">خطأ: ${err.message}</div>`;
    });
  </script>
</body>
</html>
